{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "helm-visualiser.fullname" . }}
  labels:
    {{- include "helm-visualiser.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "helm-visualiser.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
        {{- range .Values.networkPolicy.allowFromNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
      ports:
        - port: http
  {{- if .Values.networkPolicy.allowEgress }}
  egress:
    - {}
  {{- else }}
  egress: []
  {{- end }}
{{- end }}
