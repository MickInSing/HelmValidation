apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helm-visualiser.fullname" . }}
  labels:
    {{- include "helm-visualiser.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "helm-visualiser.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "helm-visualiser.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "helm-visualiser.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: PORT
              value: "8080"
            - name: MAX_UPLOAD_MB
              value: {{ .Values.app.maxUploadMB | quote }}
            - name: HELM_TIMEOUT
              value: {{ .Values.app.helmTimeoutSeconds | quote }}
            {{- if .Values.database.enabled }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  {{- if eq .Values.database.mode "cnpg" }}
                  name: {{ include "helm-visualiser.fullname" . }}-db-app
                  key: uri
                  {{- else }}
                  name: {{ required "database.external.secretName is required when database.mode=external" .Values.database.external.secretName }}
                  key: {{ .Values.database.external.secretKey }}
                  {{- end }}
            - name: SCAN_RETENTION_DAYS
              value: {{ .Values.database.retentionDays | quote }}
            {{- end }}
            - name: SCHEDULER
              value: {{ ternary "on" "off" .Values.scheduler.enabled | quote }}
            {{- with .Values.grafanaUrl }}
            - name: GRAFANA_URL
              value: {{ . | quote }}
            {{- end }}
            - name: GIT_ALLOWED_HOSTS
              value: {{ join "," .Values.git.allowedHosts | quote }}
            - name: GIT_TIMEOUT
              value: {{ .Values.git.timeoutSeconds | quote }}
            - name: GIT_MAX_MB
              value: {{ .Values.git.maxRepoMB | quote }}
            {{- with .Values.git.tokenSecret.name }}
            - name: GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.git.tokenSecret.key }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmp.sizeLimit }}
