{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "helm-visualiser.serviceAccountName" . }}
  labels:
    {{- include "helm-visualiser.labels" . | nindent 4 }}
# The app never calls the Kubernetes API: no token, no RBAC.
automountServiceAccountToken: false
{{- end }}
