apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "webshop.fullname" . }}
  labels:
    {{- include "webshop.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "webshop.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "webshop.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "webshop.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "webshop.fullname" . }}
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "webshop.fullname" . }}-db
                  key: username
            - name: DB_PASSWORD
              value: {{ .Values.database.password | quote }}
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        {{- if .Values.metrics.enabled }}
        - name: metrics
          image: {{ .Values.metrics.image }}
          ports:
            - name: metrics
              containerPort: 9113
        {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
