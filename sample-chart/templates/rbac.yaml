{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "webshop.fullname" . }}
  labels:
    {{- include "webshop.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "webshop.fullname" . }}
  labels:
    {{- include "webshop.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "webshop.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "webshop.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
